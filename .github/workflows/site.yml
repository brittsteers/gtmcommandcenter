name: 3 · Publish dashboard

# Builds the static dashboard from every finished run and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["docs/**", "runs/**", "build_site.py"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write   # required by deploy-pages (not used for Anthropic)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # include the status that finalize just committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
